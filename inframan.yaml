# Managed by Inframan — generated from console config. Edits here are the source of truth.
version: v1
application: docker-2048
services:
    api:
        type: web
        port: 8080
        domain: 8june.inframan.cloud
        path_prefix: /
        node_pool: application-pool
        scaling:
            type: concurrency
            min_replicas: 0
            max_replicas: 3
            target: 100
        resources:
            cpu_request: 50m
            memory_request: 64Mi
            cpu_limit: 200m
            memory_limit: 128Mi
        network:
            private: false
            timeout_seconds: 60
            liveness_probe:
                path: /ping
                timeout_seconds: 2
                period_seconds: 10
                failure_threshold: 3
            readiness_probe:
                path: /ping
                timeout_seconds: 2
                period_seconds: 5
                initial_delay_seconds: 5
                failure_threshold: 3
            startup_probe:
                path: /ping
                timeout_seconds: 2
                period_seconds: 5
                failure_threshold: 30
            vs_annotations:
                inframan.cloud/component: api
        path: api
        build:
            method: docker
            dockerfile: ./Dockerfile
        env:
            LOG_LEVEL: info
        connections:
            GAME_URL: service/game
            REDIS_URL: redis/sessions
        secrets:
            TEST_HAHA: TEST_HAHA
    game:
        type: web
        port: 80
        domain: demo.inframan.cloud
        path_prefix: /
        node_pool: application-pool
        scaling:
            type: concurrency
            min_replicas: 0
            max_replicas: 3
            target: 100
        resources:
            cpu_request: 20m
            memory_request: 64Mi
            cpu_limit: 200m
            memory_limit: 128Mi
        network:
            private: false
            timeout_seconds: 30
            liveness_probe:
                path: /
                timeout_seconds: 2
                period_seconds: 10
                failure_threshold: 3
            readiness_probe:
                path: /
                timeout_seconds: 2
                period_seconds: 5
                initial_delay_seconds: 3
                failure_threshold: 3
            startup_probe:
                path: /
                timeout_seconds: 2
                period_seconds: 5
                failure_threshold: 30
            vs_annotations:
                inframan.cloud/component: game
        path: game
        build:
            method: docker
            dockerfile: ./Dockerfile
        env:
            APP_ENV: production
        connections:
            API_URL: service/api


